name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The package says it is OS independent, and multiprocessing starts
          # workers differently on Windows and macOS, so check those once too.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: python -m pip install tox
      - name: Run tests
        # Runs tox with the Python version on PATH
        run: tox -e py

  test-old-python:
    # GitHub's runners no longer offer Python 3.6 and 3.7, so use the official Docker images.
    name: test (Python ${{ matrix.python }}, container)
    runs-on: ubuntu-latest
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.6", "3.7"]
    steps:
      - uses: actions/checkout@v4
      - name: Install the package with test dependencies
        run: python -m pip install ".[test]"
      - name: Swap in the headless OpenCV build
        # The slim images lack the GUI libraries opencv-python loads. The headless
        # wheel of the same version provides the same cv2 module without them.
        run: |
          version=$(python -m pip show opencv-python | sed -n 's/^Version: //p')
          python -m pip install "opencv-python-headless==$version"
      - name: Run tests
        run: python -m pytest tests

  package:
    # Build the sdist and wheel the same way the release workflow does, and validate the metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
